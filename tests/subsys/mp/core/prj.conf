CONFIG_ZTEST=y
CONFIG_MP=y

# The caps/structure/value layer is heap-free; a small heap only covers the
# rest of the subsystem that is compiled in but not exercised here.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Keep the pools small so the leak-detection loops would fail fast on a leak.
CONFIG_MP_VALUE_POOL_SIZE=64
CONFIG_MP_STRUCTURE_POOL_SIZE=8
CONFIG_MP_STRUCTURE_FIELD_POOL_SIZE=32
CONFIG_MP_CAPS_POOL_SIZE=8
